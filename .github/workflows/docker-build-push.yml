name: Build and Push Docker Image to Aliyun ACR

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'homework3/app_507029916162/**'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'homework3/app_507029916162/**'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch: # 允许手动触发

env:
  DOCKER_REGISTRY: crpi-925djdtsud86yqkr.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: hhc
  IMAGE_NAMESPACE: hhc510105200301150090
  DOCKERFILE_PATH: homework3/app_507029916162/Dockerfile
  BUILD_CONTEXT: homework3/app_507029916162

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Aliyun Container Registry
      if: github.event_name != 'pull_request'
      run: |
        echo "Logging in to Aliyun Container Registry..."
        echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | docker login ${{ env.DOCKER_REGISTRY }} \
          --username "${{ secrets.ALIYUN_ACR_USERNAME }}" \
          --password-stdin
        echo "Login successful!"

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ env.BUILD_CONTEXT }}
        file: ${{ env.DOCKERFILE_PATH }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Note: Aliyun ACR doesn't support BuildKit cache manifests, so cache is disabled
        # cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache
        # cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    - name: Output image info
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "✅ Docker image built successfully (PR build, not pushed)"
          echo "📦 Image tags (not pushed):"
          echo "${{ steps.meta.outputs.tags }}"
        else
          echo "✅ Docker image built and pushed successfully!"
          echo "📦 Image tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "🔗 Image URL:"
          echo "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}"
        fi

